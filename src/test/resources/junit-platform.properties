# flag enabling parallel test execution mode
junit.jupiter.execution.parallel.enabled=true

# flag defining default test execution mode (single-threaded or parallel)
# possible values: same-thread / concurrent
# same-thread: tests executed single-threaded if NOT redefined by annotations
junit.jupiter.execution.parallel.mode.default=concurrent

# enables parallelism only on methods(=tests) level
junit.jupiter.execution.parallel.mode.classes.default=same_thread

# flag defining the thread allocation strategy
# possible values: dynamic / fixed
# dynamic -> the number of threads is selected automatically (approximately equal to the number of CPU cores)
# fixed -> you manually define the exact number of threads (see the next flag)
junit.jupiter.execution.parallel.config.strategy=dynamic

# flag specifying the number of parallel threads
# this parameter is ignored if you use dynamic instead of fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=2